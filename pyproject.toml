# Managed with uv (https://docs.astral.sh/uv/). See README "Develop".

[project]
name = "yt2mp3slicer"
version = "0.1.0"
description = "Download a long YouTube video and slice it into individually-tagged MP3 tracks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lautaro Araujo" }]
keywords = ["youtube", "mp3", "audio", "slicer", "yt-dlp", "ffmpeg"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "PySide6>=6.7,<7",
    "mutagen>=1.47,<2",
    "yt-dlp>=2024.8.6",
]

# `dev` is installed by default with `uv sync`; `build` is opt-in via
# `uv sync --group build` (used by the per-platform build scripts).
[dependency-groups]
dev = [
    "pytest>=8",
]
build = [
    "pyinstaller>=6.10",
]

[tool.uv]
# App, not a library: skip building/installing the project itself.
package = false

[tool.pytest.ini_options]
# `slicer/` lives at the repo root and isn't installed into the venv.
pythonpath = ["."]
testpaths = ["tests"]
