# Managed with uv (https://docs.astral.sh/uv/). See README "Develop".

[project]
name = "yt2mp3slicer"
version = "0.1.0"
description = "Download a long YouTube video and slice it into individually-tagged MP3 tracks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "Lautaro Araujo" }]
keywords = ["youtube", "mp3", "audio", "slicer", "yt-dlp", "ffmpeg"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    # Keep macOS release builds usable on older Intel Macs. PySide6 6.8+
    # raises the macOS wheel target beyond 11.0, and 6.10+ requires 13.0.
    "PySide6>=6.7,<6.8",
    "certifi>=2024.8.30",
    "mutagen>=1.47,<2",
    "yt-dlp>=2024.8.6",
]

# `dev` is installed by default with `uv sync`; `build` is opt-in via
# `uv sync --group build` (used by the per-platform build scripts).
[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8",
]
build = [
    "pyinstaller>=6.10",
]

[tool.uv]
# App, not a library: skip building/installing the project itself.
package = false

[tool.pytest.ini_options]
# `slicer/` lives at the repo root and isn't installed into the venv.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
fix = true
line-length = 120

[tool.ruff.lint]
# N802/N815: PySide6 / Qt requires camelCase for Signal() declarations and
# event-handler overrides (closeEvent etc.) — Qt dispatches by exact method
# name, so renaming silently breaks behavior. Disabled project-wide since
# this is a Qt app.
ignore = ["PTH123", "PTH118", "TC003", "TC002", "TD002", "TD003", "N802", "N815"]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "RET",      # Good return practices
    # "NPY",      # Some numpy-specific things
]

[tool.isort]
profile="black"
line_length = 120


[tool.black]
line-length = 120
