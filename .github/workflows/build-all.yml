name: Build All

# Builds Windows, Linux, and macOS in parallel. On `release: published` the
# resulting archives are attached to the release; on manual `workflow_dispatch`
# they're left as run artifacts.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows:
    name: Windows
    uses: ./.github/workflows/build-windows.yml

  build-linux:
    name: Linux
    uses: ./.github/workflows/build-linux.yml

  build-macos:
    name: macOS
    uses: ./.github/workflows/build-macos.yml

  upload:
    name: Upload artifacts to GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to upload assets to the release

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yt2mp3slicer-*
          path: release-files
          merge-multiple: true

      - name: List collected files
        run: ls -la release-files

      - name: Attach archives to the release
        uses: softprops/action-gh-release@v2
        with:
          # Don't pass `name` / `body`: the release was authored by a human
          # and we only want to upload assets to it.
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-files/yt2mp3slicer-windows.zip
            release-files/yt2mp3slicer-linux-x86_64.tar.gz
            release-files/yt2mp3slicer-macos-*.zip
          fail_on_unmatched_files: true
