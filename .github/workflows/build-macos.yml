name: Build macOS

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build macOS .app (${{ matrix.arch }}, unsigned)
    runs-on: ${{ matrix.runner }}

    strategy:
      # Don't cancel one arch if the other fails — we want both signals.
      fail-fast: false
      matrix:
        include:
          # macos-latest is currently macos-14 (Apple Silicon).
          - arch: arm64
            runner: macos-latest
          # macos-13 is the last hosted x86_64 runner image.
          - arch: x86_64
            runner: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sanity-check runner architecture
        # Catch silently-mismatched runner images before producing a
        # wrong-arch binary that only fails for end users.
        run: |
          ACTUAL="$(uname -m)"
          EXPECTED="${{ matrix.arch }}"
          echo "Runner reports arch: $ACTUAL (expected: $EXPECTED)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Runner arch ($ACTUAL) does not match matrix arch ($EXPECTED)"
            exit 1
          fi

      - name: Sync project venv (runtime + build deps)
        run: uv sync --group build

      - name: Install ffmpeg via Homebrew
        # Brew installs an arch-native binary; PyInstaller follows its
        # dylibs into the .app's Frameworks folder.
        run: |
          brew update --quiet
          brew install ffmpeg
          mkdir -p build/ffmpeg-bin
          BREW_PREFIX="$(brew --prefix)"
          cp "$BREW_PREFIX/bin/ffmpeg"  build/ffmpeg-bin/
          cp "$BREW_PREFIX/bin/ffprobe" build/ffmpeg-bin/
          chmod +x build/ffmpeg-bin/*

      - name: Run PyInstaller
        run: uv run pyinstaller --noconfirm --clean --workpath build/build --distpath dist build/yt2mp3slicer.spec

      - name: Verify .app was produced
        run: |
          test -d dist/yt2mp3slicer.app || { echo "Missing dist/yt2mp3slicer.app"; exit 1; }
          ls -la dist/yt2mp3slicer.app/Contents/MacOS/
          file dist/yt2mp3slicer.app/Contents/MacOS/yt2mp3slicer

      - name: Smoke test (launch + quit)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/yt2mp3slicer.app/Contents/MacOS/yt2mp3slicer &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "App exited prematurely"
            wait "$PID" || true
            exit 1
          fi
          kill -TERM "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "App started cleanly."

      - name: Zip the .app
        # `ditto` preserves resource forks and Frameworks/ symlinks where
        # `zip` / Compress-Archive break the bundle.
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/yt2mp3slicer.app "dist/yt2mp3slicer-macos-${{ matrix.arch }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # Names must be unique across matrix jobs in v4.
          name: yt2mp3slicer-macos-${{ matrix.arch }}
          path: dist/yt2mp3slicer-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
