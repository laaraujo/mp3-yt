name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Linux x86_64
    # ubuntu-22.04 keeps the glibc baseline broad enough that the binary
    # runs on most distros from ~2022 onwards.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install system Qt runtime deps
        # PyInstaller bundles Qt libs, but the xcb platform plugin still
        # needs these system libraries available at runtime.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 \
            libdbus-1-3

      - name: Sync project venv (runtime + build deps)
        # --locked: fail if uv.lock is out of date with pyproject.toml so
        # release builds never silently re-resolve.
        run: uv sync --locked --group build

      - name: Download ffmpeg (BtbN LGPL linux x86_64)
        run: |
          mkdir -p build/ffmpeg-bin
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz"
          curl -L --fail "$url" -o build/ffmpeg.tar.xz
          mkdir -p build/ffmpeg-extracted
          tar --no-same-owner -xJf build/ffmpeg.tar.xz -C build/ffmpeg-extracted
          bin_dir="$(find build/ffmpeg-extracted -type d -name bin | head -n1)"
          cp "$bin_dir/ffmpeg" build/ffmpeg-bin/
          cp "$bin_dir/ffprobe" build/ffmpeg-bin/
          chmod +x build/ffmpeg-bin/*
          rm -rf build/ffmpeg-extracted build/ffmpeg.tar.xz

      - name: Run PyInstaller
        run: uv run pyinstaller --noconfirm --clean --workpath build/build --distpath dist build/yt2mp3slicer.spec

      - name: Verify launcher was produced
        run: |
          test -x dist/yt2mp3slicer/yt2mp3slicer || { echo "Missing dist/yt2mp3slicer/yt2mp3slicer"; exit 1; }
          ls -la dist/yt2mp3slicer

      - name: Smoke test (start + quit headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/yt2mp3slicer/yt2mp3slicer &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "App exited prematurely"
            wait "$PID" || true
            exit 1
          fi
          kill -TERM "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "App started cleanly."

      - name: Tarball
        run: tar -C dist -czf dist/yt2mp3slicer-linux-x86_64.tar.gz yt2mp3slicer

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt2mp3slicer-linux-x86_64
          path: dist/yt2mp3slicer-linux-x86_64.tar.gz
          if-no-files-found: error
