name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync project venv (runtime + build deps)
        # --locked: fail if uv.lock is out of date with pyproject.toml so
        # release builds never silently re-resolve.
        run: uv sync --locked --group build

      - name: Download ffmpeg (BtbN LGPL win64)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          $zip = "build/ffmpeg.zip"
          $extract = "build/ffmpeg-extracted"
          New-Item -ItemType Directory -Force -Path build/ffmpeg-bin | Out-Null
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ff = Get-ChildItem -Path $extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ff.FullName build/ffmpeg-bin/
          Copy-Item (Join-Path $ff.Directory.FullName "ffprobe.exe") build/ffmpeg-bin/
          Remove-Item $zip
          Remove-Item -Recurse -Force $extract

      - name: Run PyInstaller
        run: uv run pyinstaller --noconfirm --clean --workpath build/build --distpath dist build/yt2mp3slicer.spec

      - name: Verify .exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/yt2mp3slicer/yt2mp3slicer.exe")) {
            throw "Build did not produce dist/yt2mp3slicer/yt2mp3slicer.exe"
          }
          Get-ChildItem dist/yt2mp3slicer | Format-Table Name, Length

      - name: Smoke test (start + quit headless)
        shell: pwsh
        # Confirms the bundled .exe imports without missing-DLL errors.
        run: |
          $env:QT_QPA_PLATFORM = "minimal"
          $proc = Start-Process -FilePath "dist/yt2mp3slicer/yt2mp3slicer.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "App exited prematurely with code $($proc.ExitCode)"
          }
          $proc | Stop-Process -Force
          Write-Host "App started cleanly."

      - name: Zip distribution folder
        shell: pwsh
        run: Compress-Archive -Path "dist/yt2mp3slicer/*" -DestinationPath "dist/yt2mp3slicer-windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt2mp3slicer-windows
          path: dist/yt2mp3slicer-windows.zip
          if-no-files-found: error
